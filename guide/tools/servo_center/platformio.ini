; Desk Buddy v3.1 - servo centre + bench-test sketch
; Board: Guition JC4827W543C (ESP32-S3, 4 MB flash, 8 MB OPI PSRAM) - the screen board,
; which drives both PCA9685 servo boards over I2C (pin plan: shopping/BOM_Audit_2026-09-26.md 2d).
;
; Build:   pio run
; Upload:  pio run -t upload        (unplug the 5 V lead to P1 first - see the guide, "Bench test")
; Monitor: pio device monitor
;
; If the Serial Monitor stays empty after an upload, the board's USB-C goes to the ESP32-S3's
; own USB port instead of a USB-serial chip: change ARDUINO_USB_CDC_ON_BOOT to 1 and upload again.

[env:guition_s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
