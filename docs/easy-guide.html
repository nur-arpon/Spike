<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easy Build Guide</title>
<meta name="description" content="Build Spike one picture at a time: one action per card, the new part glowing orange, a check before you move on.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#15100C">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&amp;family=Inter:wght@400..700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css?v=20261014-dark1">
<style>
/* the card player: one card per screen */
html, body { height: 100%; }
body { overflow-x: hidden; }
.eg { max-width: 760px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); min-height: 100%; display: flex; flex-direction: column; }
.eg-top { position: sticky; top: 0; z-index: 5; padding: 10px 0 8px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.eg-row { display: flex; align-items: center; gap: 10px; }
.eg-home { display: inline-flex; flex: none; width: 40px; height: 40px; border-radius: 12px; align-items: center; justify-content: center; }
.eg-home img { width: 32px; height: 32px; }
.eg-stepbtn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; padding: 8px 12px; cursor: pointer; min-height: 48px; }
.eg-stepbtn:hover { border-color: var(--ink-3); }
.eg-id { flex: none; font-weight: 700; font-size: .85rem; background: var(--accent); color: #fff; border-radius: 8px; padding: 3px 8px; }
.eg-title { flex: 1; min-width: 0; font-weight: 600; font-size: .95rem; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.eg-caret { flex: none; opacity: .7; }
.eg-prog { margin-top: 8px; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.eg-prog > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #F08A2E); border-radius: 6px; transition: width .25s var(--ease); }
.eg-count { margin-top: 5px; display: flex; justify-content: space-between; font-size: .8rem; color: var(--ink-3); }
.eg-card { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-top: 6px; touch-action: pan-y; }
.eg-start { border-left: 4px solid var(--accent); padding: 6px 12px; color: var(--ink-2); font-size: .92rem; background: var(--surface); border-radius: 0 12px 12px 0; }
.eg-start b { color: var(--ink); }
.eg-fig { margin: 0; background: #EFE9DF; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow-md); display: flex; align-items: center; justify-content: center; }
.eg-fig img { display: block; width: 100%; height: auto; max-height: 62vh; max-height: 62svh; object-fit: contain; }
.eg-fig.coming { aspect-ratio: 4 / 3; flex-direction: column; gap: 10px; color: #6B5646; text-align: center; padding: 24px; }
.eg-fig.coming b { font: 600 1.6rem/1.2 var(--display); color: #2E2019; }
.eg-do { font-size: 1.35rem; line-height: 1.35; font-weight: 700; margin: 0; color: var(--ink); }
.eg-code { margin: 0; font: 600 0.95rem/1.4 Consolas, "Cascadia Mono", "Courier New", monospace; background: #2E2019; color: #FFF3E3; border-radius: 12px; padding: 10px 12px; white-space: pre-wrap; word-break: break-all; user-select: all; }
.eg-check, .eg-warn { margin: 0; display: flex; gap: 10px; align-items: flex-start; font-size: 1.02rem; line-height: 1.4; border-radius: 12px; padding: 10px 12px; }
.eg-check { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ink); }
.eg-warn { background: color-mix(in srgb, #E0564F 18%, transparent); color: var(--ink); font-weight: 600; }
.eg-check svg, .eg-warn svg { flex: none; width: 22px; height: 22px; margin-top: 1px; }
.eg-parts { margin: 0; padding-left: 20px; color: var(--ink-2); font-size: .95rem; }
.eg-parts li { margin: 4px 0; }
.eg-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
.eg-nav .in { max-width: 760px; margin: 0 auto; display: flex; gap: 12px; }
.eg-nav button { font: 700 1.05rem var(--body); border-radius: 16px; min-height: 56px; cursor: pointer; border: 1px solid var(--line-strong); }
.eg-back { flex: 1; background: var(--surface); color: var(--ink); }
.eg-next { flex: 2; background: var(--btn-bg); color: var(--btn-ink); border-color: transparent !important; }
.eg-nav button:disabled { opacity: .4; cursor: default; }
.eg-nav button:focus-visible, .eg-stepbtn:focus-visible { outline: 3px solid #F08A2E; outline-offset: 2px; }
dialog.eg-list { width: min(680px, calc(100vw - 24px)); max-height: 86vh; border: 1px solid var(--line-strong); border-radius: 20px; padding: 0; background: var(--surface); color: var(--ink); }
dialog.eg-list::backdrop { background: rgba(10, 6, 4, .6); }
.eg-list header { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.eg-list header b { font: 600 1.2rem var(--display); }
.eg-list header button { font: inherit; background: none; border: 1px solid var(--line-strong); color: var(--ink); border-radius: 10px; padding: 6px 12px; cursor: pointer; }
.eg-list h3 { margin: 14px 16px 6px; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.eg-list ol { list-style: none; margin: 0; padding: 0 8px 8px; }
.eg-list li button { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; font: inherit; color: var(--ink); background: none; border: 0; border-radius: 12px; padding: 10px 8px; cursor: pointer; min-height: 48px; }
.eg-list li button:hover { background: var(--surface-2); }
.eg-list li button[aria-current="true"] { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.eg-list .n { flex: none; min-width: 52px; font-weight: 700; color: var(--accent-text); }
.eg-list .t { flex: 1; min-width: 0; line-height: 1.3; }
.eg-list .c { flex: none; font-size: .78rem; color: var(--ink-3); }
.eg-list .soon { flex: none; font-size: .72rem; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 8px; color: var(--ink-3); }
@media (min-width: 900px) { .eg-do { font-size: 1.55rem; } .eg-fig img { max-height: 66vh; } }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<main class="eg" id="main">
  <div class="eg-top">
    <div class="eg-row">
      <a class="eg-home" href="./" aria-label="Spike home"><img src="assets/img/logo.svg" alt="" width="32" height="32"></a>
      <button class="eg-stepbtn" id="egStep" type="button" aria-haspopup="dialog" aria-label="Choose a step">
        <span class="eg-id" id="egId">B1</span><span class="eg-title" id="egTitle">Loading</span>
        <svg class="eg-caret" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
    <div class="eg-prog" role="progressbar" aria-label="Progress through the guide" aria-valuemin="0" aria-valuemax="100" id="egProg"><i id="egBar"></i></div>
    <div class="eg-count"><span id="egCount"></span><span id="egTotal"></span></div>
  </div>
  <section class="eg-card" id="egCard" aria-live="polite"></section>
  <noscript><p>This guide needs JavaScript. The same cards are in the printed PDF.</p></noscript>
</main>
<nav class="eg-nav" aria-label="Card navigation"><div class="in">
  <button class="eg-back" id="egBack" type="button">&larr; Back</button>
  <button class="eg-next" id="egNext" type="button">Next &rarr;</button>
</div></nav>
<dialog class="eg-list" id="egList" aria-label="All steps">
  <header><b>All steps</b><button type="button" id="egClose">Close</button></header>
  <div id="egListBody"></div>
</dialog>
<script src="assets/easyguide/easy-guide-data.js?v=202e16bbea"></script>
<script>
(function () {
  "use strict";
  var G = window.EASY_GUIDE;
  if (!G) { document.getElementById("egCard").textContent = "The guide data did not load."; return; }
  var KEY = "spike-easy-guide-pos";
  var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>';
  function esc(s) { return String(s || "").replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // flatten: every card of every step; a step without cards is one "coming" card
  var seq = [], stepFirst = {}, stepsById = {};
  G.steps.forEach(function (st, si) {
    stepsById[st.id] = st; stepFirst[st.id] = seq.length;
    var cards = st.cards.length ? st.cards : [{ coming: true }];
    cards.forEach(function (c, ci) { seq.push({ step: st, si: si, ci: ci, n: cards.length, card: c }); });
  });

  var pos = 0;
  function save() { try { localStorage.setItem(KEY, String(pos)); } catch (e) { /* private mode: fine */ } }
  function load() {
    var m = /^#([A-Za-z0-9]+)(?:-(\d+))?$/.exec(location.hash || "");
    if (m && stepFirst[m[1]] != null) return Math.min(stepFirst[m[1]] + Math.max(0, (+m[2] || 1) - 1), seq.length - 1);
    try { var v = parseInt(localStorage.getItem(KEY), 10); if (v >= 0 && v < seq.length) return v; } catch (e) { /* ignore */ }
    return 0;
  }

  var $ = function (id) { return document.getElementById(id); };
  function render() {
    var it = seq[pos], st = it.step, c = it.card, h = "";
    $("egId").textContent = st.id; $("egTitle").textContent = st.title;
    $("egBar").style.width = ((pos + 1) / seq.length * 100).toFixed(2) + "%";
    $("egProg").setAttribute("aria-valuenow", Math.round((pos + 1) / seq.length * 100));
    $("egCount").textContent = "Step " + (it.si + 1) + " of " + G.steps.length + " · card " + (it.ci + 1) + " of " + it.n;
    $("egTotal").textContent = (pos + 1) + " / " + seq.length;
    if (it.ci === 0) {
      h += '<div class="eg-start"><b>Step ' + esc(st.id) + '</b>' + (st.time ? " · " + esc(st.time) : "") + (st.why ? "<br>" + esc(st.why) : "") + "</div>";
    }
    if (c.coming) {
      h += '<figure class="eg-fig coming"><b>Coming soon</b><span>The picture cards for this step are being made.</span>' +
           '<a class="btn btn--primary" href="build-guide.html#step-' + esc(st.id) + '">Open this step in the full guide</a></figure>';
      h += '<p class="eg-do">' + esc(st.title) + "</p>";
    } else {
      if (c.img) h += '<figure class="eg-fig"><img src="' + esc(c.img) + '" width="' + c.w + '" height="' + c.h + '" alt="' + esc(c.text) + '"></figure>';
      h += '<p class="eg-do">' + esc(c.text) + "</p>";
      if (c.code) h += '<pre class="eg-code">' + esc(c.code) + "</pre>";
      if (c.parts && c.parts.length) h += '<ul class="eg-parts">' + c.parts.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ul>";
      if (c.check) h += '<p class="eg-check">' + TICK + "<span>" + esc(c.check) + "</span></p>";
      if (c.warn) h += '<p class="eg-warn">' + WARN + "<span>" + esc(c.warn) + "</span></p>";
    }
    $("egCard").innerHTML = h;
    $("egBack").disabled = pos === 0;
    $("egNext").disabled = pos === seq.length - 1;
    $("egNext").innerHTML = pos === seq.length - 1 ? "The end" : (it.ci === it.n - 1 ? "Next step &rarr;" : "Next &rarr;");
    var nx = seq[pos + 1];
    if (nx && nx.card.img) { var pre = new Image(); pre.src = nx.card.img; }
    var hsh = "#" + st.id + "-" + (it.ci + 1);
    if (location.hash !== hsh) { try { history.replaceState(null, "", hsh); } catch (e) { /* file:// */ } }
    save();
  }
  function go(d) { var p = Math.max(0, Math.min(seq.length - 1, pos + d)); if (p !== pos) { pos = p; render(); window.scrollTo(0, 0); } }
  $("egNext").addEventListener("click", function () { go(1); });
  $("egBack").addEventListener("click", function () { go(-1); });
  document.addEventListener("keydown", function (e) {
    if ($("egList").open || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
  });
  // swipe on the card
  var sx = null, sy = 0;
  $("egCard").addEventListener("pointerdown", function (e) { if (e.pointerType !== "mouse") { sx = e.clientX; sy = e.clientY; } });
  $("egCard").addEventListener("pointerup", function (e) {
    if (sx == null) return;
    var dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) go(dx < 0 ? 1 : -1);
  });
  $("egCard").addEventListener("pointercancel", function () { sx = null; });
  window.addEventListener("hashchange", function () { var p = load(); if (p !== pos) { pos = p; render(); } });

  // the step list
  function buildList() {
    var cur = seq[pos].step.id, h = "";
    G.phases.forEach(function (ph) {
      h += "<h3>" + esc(ph.title) + "</h3><ol>";
      G.steps.forEach(function (st) {
        if (st.phase !== ph.id) return;
        h += '<li><button type="button" data-step="' + esc(st.id) + '"' + (st.id === cur ? ' aria-current="true"' : "") + '><span class="n">' + esc(st.id) +
             '</span><span class="t">' + esc(st.title) + "</span>" + (st.coming ? '<span class="soon">coming</span>' : '<span class="c">' + st.cards.length + " cards</span>") + "</button></li>";
      });
      h += "</ol>";
    });
    $("egListBody").innerHTML = h;
  }
  $("egStep").addEventListener("click", function () {
    buildList();
    if ($("egList").showModal) $("egList").showModal(); else $("egList").setAttribute("open", "");
    var c = $("egListBody").querySelector('[aria-current="true"]'); if (c) { c.scrollIntoView({ block: "center" }); c.focus(); }
  });
  $("egClose").addEventListener("click", function () { $("egList").close(); });
  $("egListBody").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-step]"); if (!b) return;
    pos = stepFirst[b.getAttribute("data-step")]; $("egList").close(); render(); window.scrollTo(0, 0);
  });

  pos = load(); render();
})();
</script>
<script src="assets/js/light-field.js?v=20261014-dark1" defer></script>
</body>
</html>
