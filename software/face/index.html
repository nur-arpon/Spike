<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spike -- Face &amp; Sound Simulator</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel-bg: #14171c;
    --panel-bg-2: #1b1f26;
    --text: #eef1f5;
    --muted-text: #93a0ad;
    --accent: #59d9ff;
    --accent-dim: #2b6f82;
    --focus-ring: #ffd23f;
    --border: #262b33;
    --danger: #ff5c77;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    height: 100%;
  }

  .layout {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    padding: 20px;
    min-height: 100vh;
    align-items: flex-start;
    justify-content: center;
  }

  .stage {
    flex: 1 1 480px;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .canvas-wrap {
    position: relative;
    background: #000;
    border-radius: 18px;
    border: 1px solid var(--border);
    box-shadow: 0 0 0 1px #000, 0 20px 60px rgba(0,0,0,0.5);
    overflow: hidden;
    touch-action: manipulation;
  }

  #face-canvas { display: block; cursor: pointer; }

  .caption-bubble {
    position: absolute;
    left: 50%;
    top: 10px;
    transform: translateX(-50%);
    max-width: 88%;
    background: rgba(20, 23, 28, 0.92);
    border: 1px solid var(--accent-dim);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 14px;
    font-size: 14px;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .caption-bubble.visible { opacity: 1; }

  .stage-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 13px;
    color: var(--muted-text);
  }

  .panel {
    flex: 1 1 340px;
    max-width: 420px;
    min-width: 280px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .group {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .group h3 {
    margin: 0 0 10px 0;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted-text);
  }

  .btn-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 8px;
  }
  #mood-grid, #action-grid {
    max-height: 220px;
    overflow-y: auto;
    padding-right: 2px;
  }

  input[type="range"] { flex: 1; accent-color: var(--accent); }
  .battery-readout { font-size: 13px; color: var(--text); min-width: 44px; text-align: right; }
  .action-label-line { font-size: 12px; color: var(--accent); margin-top: 8px; min-height: 1.2em; }

  button, .toggle-btn {
    font-family: inherit;
    font-size: 13px;
    background: var(--panel-bg-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.05s ease;
  }
  button:hover { background: #232833; border-color: var(--accent-dim); }
  button:active { transform: scale(0.97); }
  button:focus-visible, .toggle-btn:focus-visible, input:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }
  button.primary { background: var(--accent-dim); border-color: var(--accent); }
  button.danger { border-color: var(--danger); }
  button[aria-pressed="true"] { background: var(--accent-dim); border-color: var(--accent); }

  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row.between { justify-content: space-between; }

  .mode-toggle { display: flex; gap: 8px; }
  .mode-toggle button { flex: 1; }

  .score-line { font-size: 13px; color: var(--muted-text); margin-top: 8px; }

  label.inline { font-size: 13px; color: var(--muted-text); display: flex; align-items: center; gap: 6px; }

  footer { color: var(--muted-text); font-size: 11px; text-align: center; padding: 6px 0 18px; }

  @media (max-width: 640px) {
    .layout { padding: 12px; gap: 14px; }
    .panel { max-width: 100%; }
    .btn-grid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
  }
</style>
</head>
<body>
  <div class="layout">
    <div class="stage">
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="face-canvas" width="480" height="272" aria-label="Spike's face"></canvas>
        <div class="caption-bubble" id="caption-bubble"></div>
      </div>
      <div class="stage-controls">
        <label class="inline"><input type="checkbox" id="true-size-toggle"> True size (480x272)</label>
        <label class="inline"><input type="checkbox" id="mute-toggle"> Mute</label>
        <label class="inline"><input type="checkbox" id="glow-toggle" checked> Soft glow</label>
        <label class="inline">Eye colour <input type="color" id="eye-color" value="#FFFFFF"></label>
      </div>
    </div>

    <div class="panel">
      <div class="group">
        <h3>Who's on screen</h3>
        <div class="mode-toggle" role="group" aria-label="Choose character">
          <button id="mode-dog-btn" class="primary" aria-pressed="true">Dog</button>
          <button id="mode-cat-btn" aria-pressed="false">Cat</button>
        </div>
        <div class="score-line" id="wake-words-line"></div>
      </div>

      <div class="group">
        <h3>Say hi</h3>
        <div class="row">
          <button id="say-hi-btn">Say Hi (wave)</button>
          <button id="greet-time-btn">Greet me (time of day)</button>
        </div>
      </div>

      <div class="group">
        <h3>Moods (click to preview)</h3>
        <div class="btn-grid" id="mood-grid"></div>
        <div class="row" style="margin-top:10px;">
          <button id="demo-btn">Demo: cycle all moods</button>
        </div>
      </div>

      <div class="group">
        <h3>Physical actions</h3>
        <div class="btn-grid" id="action-grid"></div>
        <div class="action-label-line" id="action-label-line"></div>
      </div>

      <div class="group">
        <h3>Events</h3>
        <div class="btn-grid">
          <button data-event="comeHome">Owner comes home</button>
          <button data-event="ownerSad">Owner looks sad</button>
          <button data-event="alarmStart">Alarm</button>
          <button id="im-up-btn" data-event="imUp">I'm up!</button>
          <button data-event="pickedUp">Picked up / lap</button>
          <button data-event="fellOver">Fell over</button>
          <button data-event="ignoredNudge">Ignored for ages</button>
          <button data-event="talk">Talk</button>
        </div>
      </div>

      <div class="group">
        <h3>Battery (hungry = low battery)</h3>
        <div class="row">
          <input type="range" id="battery-slider" min="0" max="100" value="70">
          <span class="battery-readout" id="battery-readout">70%</span>
        </div>
        <div class="row" style="margin-top:8px;">
          <label class="inline"><input type="checkbox" id="charging-toggle"> Charging (eating)</label>
        </div>
      </div>

      <div class="group">
        <h3>Music</h3>
        <div class="row">
          <button id="play-song-btn">Play a song</button>
          <label class="inline"><input type="checkbox" id="sing-along-toggle" checked> Sing along (lip-sync)</label>
        </div>
      </div>

      <div class="group">
        <h3>Rock / Paper / Scissors</h3>
        <div class="row">
          <button data-rps="rock">Rock (R)</button>
          <button data-rps="paper">Paper (P)</button>
          <button data-rps="scissors">Scissors (S)</button>
        </div>
        <div class="score-line" id="rps-line">Play a round to begin.</div>
      </div>
    </div>
  </div>

  <footer>Spike / Spicy face simulator -- offline, no network calls, everything drawn and synthesized locally.</footer>

  <!-- Classic scripts, in dependency order. No ES modules, so this opens fine from file://. -->
  <script src="config.js"></script>
  <script src="face_params.js"></script>
  <script src="face_draw.js"></script>
  <script src="expressions.js"></script>
  <script src="extras.js"></script>
  <script src="sounds.js"></script>
  <script src="captions.js"></script>
  <script src="games.js"></script>
  <script src="behaviour.js"></script>
  <script src="actions.js"></script>
  <script src="music.js"></script>
  <script src="app.js"></script>
</body>
</html>
