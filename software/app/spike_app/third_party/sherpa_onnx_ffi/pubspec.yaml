name: sherpa_onnx_ffi
description: >-
  Spike's vendored copy of the sherpa-onnx 1.13.8 Dart FFI bindings (Apache-2.0, see LICENSE), text-to-speech
  part only: the Dart code, WITHOUT the sherpa_onnx Flutter plugin packages that bundle the native libraries.
  The native libraries are NOT shipped with Spike: the owner fetches the official prebuilt ones from the
  sherpa-onnx GitHub release on his phone (lib/away/voice/kokoro_addon.dart), and they are opened by absolute
  path with [loadSherpaOnnx]. See README.md.
version: 1.13.8+spike.1
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  ffi: ^2.1.0
