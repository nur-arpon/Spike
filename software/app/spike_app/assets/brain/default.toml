# Spike brain - default settings.
#
# Do not edit this file to change your own setup. Put overrides in
# software/laptop/spike_settings.toml (same section names, only the keys you
# want to change). Secrets (cloud keys, pairing token) go ONLY in
# software/laptop/.env, which is git-ignored.
#
# Relative paths are relative to software/laptop/.

[brand]
# The PRODUCT's user-visible name, in ONE place for the brain (software/app/RENAMING.md). The characters'
# names (Spike, Spicy) are separate: they live in config/personas/*.toml and the owner can rename them.
product_name = "Spike"

[server]
host = "127.0.0.1"          # loopback = simulator on this laptop only
port = 8765
heartbeat_s = 5
hello_timeout_s = 5
max_message_kib = 256
# When host is not loopback (a real robot on Wi-Fi) a pairing token is
# required: set SPIKE_TOKEN in .env, or leave it out and the brain makes its
# own once (data/pairing_token.txt). `--lan` = host 0.0.0.0 (phone + robot on Wi-Fi).
trust_loopback = true       # programs on this laptop (the simulator, a phone via adb reverse) need no token

[app]
# The phone app (PROTOCOL.md section 10, v1.2)
mdns = true                 # announce "_spike._tcp" on the Wi-Fi while listening on the LAN
drive_rate_hz = 20          # joystick commands forwarded to the robot at most this often
drive_ttl_ms = 300          # dead man's switch: no word from the phone this long = wheels stop
camera_max_fps = 10         # robot camera frames relayed to a subscribed phone at most this often
memory_list_max = 200       # newest facts sent to the app's memory list
list_poll_s = 1.0           # how often the alarm and memory lists are checked for changes

[persona]
dog = "spike"               # config/personas/spike.toml
cat = "spicy"               # config/personas/spicy.toml
start_mode = "dog"          # dog | cat

[audio]
mic_device = ""             # "" = Windows default input, or part of the device name, or an index
mic_rate = 16000            # everything downstream runs at 16 kHz mono
frame_ms = 32               # 512 samples: the Silero VAD window
output = "auto"             # auto | robot | local | none
                            # auto = the simulator/robot if one is connected, else laptop speakers
local_output_device = ""    # "" = the Windows default speaker; or part of a device name, e.g. "Realtek" or "Sonar - Media"
mute_tail_ms = 300          # mic stays muted this long after Spike stops talking
say_report_timeout_s = 2.0  # if the robot never reports "finished", unmute after duration + this

[wake]
vosk_model = "models/vosk/vosk-model-small-en-us-0.15"
min_confidence = 0.60       # Vosk word confidence needed on its own ...
strong_confidence = 1.01    # >1 = off. Vosk alone may not wake him: in the 28 Sep eval it caused
                            # 11 of 12 false wakes (everyday names heard as a wake word) and rescued only 1 of 72 calls
fuzzy_threshold = 80        # rapidfuzz ratio (0-100) for matching a transcript to a wake word
follow_up_s = 6.0           # after Spike speaks you can answer without his name for this long
listen_timeout_s = 5.0      # after "Spike" (or a head tap) with nothing said, give up after this
refractory_s = 1.0          # ignore new wakes this soon after one
cross_mode_switch = true    # calling "Spicy" while Spike is out wakes her (switches mode)
personal_file = "data/personal_wake_words.toml"   # the owner's own extra wake words (git-ignored, never shipped); "" = off

[vad]
engine = "silero"           # silero | energy
model = "models/openwakeword/silero_vad.onnx"
threshold = 0.5             # speech probability
end_silence_ms = 450        # this much silence ends a request (the main latency knob)
min_speech_ms = 200
max_utterance_s = 15
preroll_ms = 320            # audio kept from before speech/wake starts

[stt]
model = "small.en"          # folder in models/whisper, used on the GPU
cpu_model = "base.en"       # used when there is no usable GPU
device = "auto"             # auto | cuda | cpu
compute_type_cuda = "float16"
compute_type_cpu = "int8"
beam_size = 1
cpu_threads = 0             # 0 = let CTranslate2 decide

[llm]
provider = "ollama"
host = "http://127.0.0.1:11434"
model = "qwen38-9b-16k:latest"
fallback_models = ["qwen3.5:9b"]
num_ctx = 4096
gpu_layers = -1             # -1 = Ollama puts as many layers on the graphics card as fit (see DESIGN.md "Graphics memory")
temperature = 0.7          # 0.8 drifted out of character more often (persona_eval, 28 Sep)
top_p = 0.9
repeat_penalty = 1.1
max_tokens = 80             # spoken replies are 1-2 short sentences (~25 words)
long_max_tokens = 220       # when asked for a story, several jokes, a song...
keep_alive = "60m"          # stays warm; the brain unloads it on exit (--llm-at-start keeps it resident, DESIGN 6c)
idle_unload = "15m"         # v1.2 on demand: nobody talked to Spike this long = the brain unloads the model (frees the GPU for the voice)
on_demand = true            # v1.2: start `ollama serve` (if not running) and warm the model only when the app
                            # connects, a wake word / head tap is heard or someone talks; scripted lines meanwhile
auto_start = true           # start `ollama serve` hidden when it is not answering
ollama_exe = ""             # "" = PATH, then %LOCALAPPDATA%\Programs\Ollama\ollama.exe
start_timeout_s = 45        # wait this long for a started Ollama to answer
warm_wait_s = 12            # a reply waits this long for a warming model before a scripted line
stop_started_on_exit = true # stop `ollama serve` on exit, but only if Spike started it
history_turns = 6           # past exchanges kept in the prompt
first_token_timeout_s = 8
total_timeout_s = 25
unload_on_exit = true

[cloud]
# OPTIONAL fallback, OFF by default. Nothing leaves this laptop unless you
# set enabled = true AND put GEMINI_API_KEY in .env. Only text is sent
# (never audio or camera frames).
enabled = false
provider = "gemini"
model = "gemini-2.5-flash"
use_when = "local_fails"    # local_fails | always
timeout_s = 12

[tts]
# Voices (DESIGN.md "Voice"). Each sentence is said by the first of these that
# works: the owner's own recording of a scripted line -> a cached Turbo clip ->
# live Chatterbox Turbo -> Kokoro -> Piper Amy. He is never silent.
# The per-persona voice (reference clip, style tags) is in the persona file.
# Speech is made one sentence at a time so Spike starts talking before the
# reply is finished.
engine = "turbo"            # turbo | kokoro | piper  (the best voice to use; the ones after it are backups)
cache_dir = "voice_cache"   # pre-made Turbo clips: python -m spike_brain.tools.build_voice_cache
recordings_dir = "voice_recordings"   # the owner's own recordings, <persona>/<line id>.wav (optional)
loudness_dbfs = -20         # every voice is brought to this loudness
first_chunk_min_words = 4   # the first chunk may break at a comma after this many words
max_chunk_chars = 220
reply_word_cap = 40         # hard cap on a spoken reply (whole sentences only)
long_word_cap = 110         # ... when a story or several jokes were asked for
volume = 1.0

[tts.turbo]
python = ""                 # "" = software/laptop/.venv-chatterbox (it has the CUDA PyTorch the voice needs)
models = "models/chatterbox-turbo"
device = "auto"             # auto | cuda | cpu | off   (auto = the graphics card if there is one)
dtype = "auto"              # auto | fp32 | bf16  (auto: fp32 as the owner's pick was made, bf16 if memory is short)
vram_fp32_mib = 3600        # graphics memory Turbo needs (measured 29 Sep: fp32 3.6 GB, bf16 2.7 GB)
vram_bf16_mib = 2700
reserve_whisper_mib = 600   # room kept for Whisper when it runs on the card (it loads after the voice)
reserve_llm_mib = 5200      # [llm] on_demand: the voice plans as if the language model were loaded (measured 5.1-5.2 GB, DESIGN 24)
synth_timeout_s = 12        # a sentence slower than this is said by Kokoro instead
start_timeout_s = 180       # first load reads 3 GB from disk (18-45 s measured)

[tts.kokoro]
model = "models/kokoro/kokoro-v1.0.onnx"
voices = "models/kokoro/voices-v1.0.bin"

[tts.piper]
fallback = "models/piper/spicy/en_US-amy-medium.onnx"   # the last-resort voice for both

[memory]
db_path = "data/spike_memory.sqlite"
max_prompt_chars = 900      # memory budget inside the LLM prompt
llm_extraction = true       # after a chat, let the local LLM pick out facts worth remembering
max_facts = 2000

[vision]
enabled = true
camera_index = 0
width = 640
height = 480
process_fps = 8
face_model = "models/mediapipe/face_landmarker.task"
gesture_model = "models/mediapipe/gesture_recognizer.task"
present_after_s = 1.0       # face seen this long = owner is here
absent_after_s = 25         # face gone this long = owner left
come_home_after_min = 20    # away at least this long = "you're home!" greeting
emotion_window_s = 8        # smoothing window for sad/happy/tired
sad_threshold = 0.45
tired_threshold = 0.55
look_at_hz = 10
mirror = false              # true if your webcam image is mirrored

[aruco]
enabled = true
dictionary = "DICT_4X4_50"
home_marker_id = 7
marker_size_m = 0.05
horizontal_fov_deg = 70     # used to estimate focal length when uncalibrated

[life]
quiet_hours = ["22:30", "07:00"]  # no unprompted chatter between these (alarms still ring)
greet_on_arrival = true
time_of_day_hello = true
checkin_quiet_min = 90      # owner here but silent this long -> gentle check-in
checkin_sad_min = 8         # owner looks sad this long -> comfort
checkin_min_gap_min = 120   # never check in more often than this
greet_on_start = true       # say hello when he starts (with a camera: when he first sees you)
people_nudge_min_gap_h = 20 # at most one "call a friend / get outside" nudge per this many hours
people_nudge_after_lonely_h = 3  # owner around but no human contact talk for this long -> nudge sooner
people_nudge_min_turns = 3  # ...and only after a real conversation (this many things said to him)
people_nudge_after_start_min = 10  # ...never this soon after start-up, and never before his hello
surprise_cat_mode_per_day = 0.5  # expected random surprise switches per day (0 = never)
battery_hungry_below = 30
battery_weak_below = 15
alarm_escalate_s = 25       # next alarm level after this long
alarm_snooze_min = 5
alarm_give_up_min = 30
reminder_repeat_s = 60      # a reminder you have not acknowledged is repeated once

[safety]
country = "AU"
llm_crisis_check = true     # a second, LLM-based check for distress the phrase list misses
checkin_after_crisis_h = 18 # gentle "how are you today?" the next day

[safety.helplines.AU]
crisis_name = "Lifeline"
crisis_number = "13 11 14"
crisis_hours = "any time, day or night"
emergency_number = "000"
# How the voice must SAY numbers (the words on screen stay "000"). Chatterbox
# Turbo read "000" as "row one" in all five takes of one line (29 Sep), so the
# emergency number is spoken the Australian way, as words.
say_as = { "000" = "triple zero" }

[safety.helplines.NZ]
crisis_name = "Need to Talk"
crisis_number = "1737"
crisis_hours = "any time"
emergency_number = "111"

[safety.helplines.UK]
crisis_name = "Samaritans"
crisis_number = "116 123"
crisis_hours = "any time"
emergency_number = "999"

[safety.helplines.US]
crisis_name = "the Suicide and Crisis Lifeline"
crisis_number = "988"
crisis_hours = "any time"
emergency_number = "911"

[debug]
save_audio = false          # true = keep each heard request as a WAV in data/debug
save_frames = false         # true = keep camera snapshots in data/debug
log_latency = true
log_level = "INFO"
