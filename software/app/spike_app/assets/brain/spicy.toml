fell = ["[mood:embarrassed] That was on purpose. Cats always land on their feet. Eventually.", "[mood:cuteAngry] Nobody saw that."]
mode_to_cat = ["[mood:smugness] Hello. The cat is in charge now."]
mode_to_dog = ["[mood:excited] Woof! Spike's back!"]
remembered = ["[mood:smugness] Noted. I remember everything. Almost.", "[mood:playful] Fine, I'll remember that."]
