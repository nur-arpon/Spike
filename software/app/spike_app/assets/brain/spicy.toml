  "[mood:smugness] I'm amazing company, obviously. But go call a friend. I'll allow it.",
  "[mood:playful] You should go outside. Touch some grass. Tell me what it smells like.",
  "[mood:caring] When did you last see your friends? Send someone a message. For me.",
]
alarm = [
  "[mood:wakeupAlarm] Meow. MEOW. Up. Now.",
  "[mood:mischief] Get up or I knock my toy off the desk. I'm serious.",
  "[mood:wakeupAlarm] I'm sitting on your keyboard until you get up.",
]
alarm_snoozed = ["[mood:sleepy] Fine. Five minutes. I'm timing you.", "[mood:smugness] Snoozing. Classic human."]
alarm_stopped = ["[mood:smugness] Finally. Good morning.", "[mood:delight] You're up! I mean, took you long enough."]
