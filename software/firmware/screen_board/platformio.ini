; Spike firmware -- SCREEN BOARD (Guition JC4827W543C: ESP32-S3, 4 MB flash, 8 MB OPI PSRAM,
; 4.3" 480x272 NV3041A QSPI panel, GT911 capacitive touch, NS4168 I2S amp on the "Speak" port).
; It runs the face, Spike's behaviour engine, audio, Wi-Fi + the brain link, AND the body (both PCA9685
; servo boards, the IMU, touch pads and lasers on the P4 I2C bus) -- see ../DESIGN.md.
;
; Build:   pio run                      (from this folder; PlatformIO 6.2 lives in software/laptop/.venv)
; Flash:   pio run -t upload            (unplug the robot's 5 V lead to P1 first -- guide, "Bench test")
; Monitor: pio device monitor
; OTA:     pio run -e ota -t upload --upload-port <robot-ip>

[platformio]
default_envs = screen

[env]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino
; BOM audit 2e: Flash 4MB, OPI PSRAM, "Minimal SPIFFS with OTA" (min_spiffs.csv: 2 x 1.9 MB app slots)
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../lib
lib_deps =
    spike_face
    spike_life
    spike_body
    moononournation/GFX Library for Arduino @ 1.4.9
    bblanchon/ArduinoJson @ 7.2.1
    pololu/VL53L0X @ 1.3.1
    ; protocol v1.3 BLE link. NimBLE-Arduino 2.5.1 = newest release (29 Jul 2026) and it builds on
    ; espressif32 6.13.0 / Arduino-ESP32 2.0.17 (DESIGN.md section 14 says why NimBLE, why 2.x).
    h2zero/NimBLE-Arduino @ 2.5.1
    spike_link
build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    ; USB: the guide's servo sketch assumes a USB-serial chip on the board's USB-C (CDC_ON_BOOT=0).
    ; Logs go to BOTH the UART and the native USB port, so either wiring shows them.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DSPIKE_FW_VERSION=\"0.2.0\"
    ; NimBLE (protocol v1.3 section 11.1): peripheral only, one phone at a time, at most 4 bonds
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=4
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0

[env:screen]

[env:ota]
upload_protocol = espota
upload_flags =
    --auth=${sysenv.SPIKE_OTA_PASSWORD}
