; Spike firmware -- CAMERA BOARD (ESP32-S3 N16R8 CAM board + OV5640, in the muzzle).
; It only needs 5 V + GND (guide P14); it talks to the laptop brain over Wi-Fi as a second WebSocket
; client (role "camera") and streams JPEG frames (protocol 6.8). The mics are NOT on this board: the
; guide wires both MS3625 mics to the screen board's P3, which streams them.
;
; Build:   pio run            Flash: pio run -t upload            Monitor: pio device monitor
[platformio]
default_envs = camera

[env]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../lib
lib_deps =
    bblanchon/ArduinoJson @ 7.2.1
    spike_link
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DSPIKE_FW_VERSION=\"0.2.0\"

[env:camera]

[env:ota]
upload_protocol = espota
upload_flags =
    --auth=${sysenv.SPIKE_OTA_PASSWORD}
